# Probe the exact native XY position action schema in Tesseract 0.3.1
name: Probe Tesseract Spatial Position Schema

on:
  push:
    branches:
      - clipback-tesseract-build

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Tesseract 0.3.1
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p /tmp/tesseract-download /tmp/tesseract-extracted
          cd /tmp/tesseract-download
          curl -fL --retry 3 -o tesseract-0.3.1-linux-x86_64.zip https://github.com/mirage-hq/Tesseract/releases/download/v0.3.1/tesseract-0.3.1-linux-x86_64.zip
          curl -fL --retry 3 -o tesseract-0.3.1-linux-x86_64.zip.sha256 https://github.com/mirage-hq/Tesseract/releases/download/v0.3.1/tesseract-0.3.1-linux-x86_64.zip.sha256
          sha256sum -c tesseract-0.3.1-linux-x86_64.zip.sha256
          unzip -q tesseract-0.3.1-linux-x86_64.zip -d /tmp/tesseract-extracted
          bash "$(find /tmp/tesseract-extracted -maxdepth 3 -type f -name install.sh | head -n 1)"
          TSRCT="$(find "$HOME/.local/share/Tesseract" -type f -name tsrct -perm -111 | head -n 1)"
          echo "TSRCT=$TSRCT" >> "$GITHUB_ENV"
          "$TSRCT" --version

      - name: Extract exact spatial keyframe schema
        run: |
          "$TSRCT" project schema > /tmp/schema.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/schema.json'))
          defs=d.get('$defs',{})
          for name in [
              "JBSetFxPositionKeyframesAction",
              "JBPropertyKeyframeTrack",
              "JBPropertyKeyframe",
              "JBBezierControl",
              "JBKeyframeValue",
          ]:
              print("\n=== DEF",name,"===")
              print(json.dumps(defs.get(name, {"missing": True}),indent=2))
          print("\n=== RELATED DEFINITIONS ===")
          for name in sorted(defs):
              if any(k in name.lower() for k in ["tangent","positionkey","position"]):
                  if name not in {"JBSetFxPositionKeyframesAction"}:
                      print("\n---",name,"---")
                      print(json.dumps(defs[name],indent=2))
          PY
